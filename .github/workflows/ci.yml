name: Build-Test CI

on:
  push:
    branches: ["**"]  # Trigger on all branches
  pull_request:
    branches: ["**"]  # Trigger on all PRs

permissions:
  contents: read  # Minimally scoped permissions for GITHUB_TOKEN

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install dependencies (Typst, Cargo)
        run: |
          sudo snap install typst
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source $HOME/.cargo/env

      - name: Install Cargo tools
        run: |
          cargo install --locked --git https://github.com/typst/package-check.git --tag v0.7.0
          cargo install --locked tytanic@0.4.1

      - name: Cache Cargo dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Lint and build project (Install package to local Typst)
        run: |
          make lint
          make install

      - name: Run tests
        run: |
          make test

      - name: Clean up (Uninstall package from local Typst)
        run: |
          make uninstall

      - name: Upload test artifacts (diffs, output, refs)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tytanic-artifacts
          path: |
            tests/**/diff/*.png
            tests/**/out/*.png
            tests/**/ref/*.png
          retention-days: 5
